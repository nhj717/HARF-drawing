[project]
name = "harf-drawing"
version = "0.1.0"
description = "Heat-Assisted Robust Fiber (HARF) drawing simulator (MATLAB v1.5 port)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.5",
    "scipy>=1.18.1",
    "pyside6>=6.9",
    "matplotlib>=3.10",
]

[project.scripts]
harf-drawing = "app.main:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
